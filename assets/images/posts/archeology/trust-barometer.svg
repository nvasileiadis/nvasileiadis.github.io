<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" role="img" aria-labelledby="tb-title tb-desc">
  <title id="tb-title">The trust barometer: documentation richness tracks team trust — and the AI wrinkle</title>
  <desc id="tb-desc">Documentation stacks grow along an axis of team trust. At zero trust, a single dashed empty outline: what I know is my security, nothing gets written. At low trust, a thin stack: grudging, incomplete, written for the checkbox. At high trust, a tall stack given willingly, including gold sheets — the confessions: mistakes admitted, traps named. Separated by a dashed divider, an AI-generated stack just as tall as the high-trust one, drawn in dashed outline: tall and complete, but no longer a signal of trust.</desc>
  <style>
    .lvl { font: 600 12px "Inter", -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; letter-spacing: 1.5px; fill: #595959; }
    .d { font: italic 400 12px "Inter", -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #595959; }
    .axis { font: italic 400 12.5px "Inter", -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #1d6340; }
    .gold { font: italic 400 11.5px "Inter", -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #8f6a08; }
  </style>
  <defs>
    <marker id="tb-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d6340"/>
    </marker>
  </defs>

  <!-- Zero trust -->
  <rect x="70" y="322" width="120" height="16" rx="3" fill="none" stroke="#b0b0aa" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="130" y="378" text-anchor="middle" class="lvl">ZERO TRUST</text>
  <text x="130" y="398" text-anchor="middle" class="d">“what I know is my security”</text>
  <text x="130" y="414" text-anchor="middle" class="d">— nothing gets written</text>

  <!-- Low trust -->
  <rect x="275" y="322" width="120" height="16" rx="3" fill="#f3f4f0" stroke="#c9c9c2" stroke-width="1.5"/>
  <rect x="272" y="311" width="120" height="16" rx="3" fill="#f3f4f0" stroke="#c9c9c2" stroke-width="1.5"/>
  <rect x="277" y="300" width="120" height="16" rx="3" fill="#f3f4f0" stroke="#c9c9c2" stroke-width="1.5"/>
  <text x="335" y="378" text-anchor="middle" class="lvl">LOW TRUST</text>
  <text x="335" y="398" text-anchor="middle" class="d">grudging, incomplete —</text>
  <text x="335" y="414" text-anchor="middle" class="d">written for the checkbox</text>

  <!-- High trust -->
  <rect x="470" y="322" width="120" height="16" rx="3" fill="#eaf1ec" stroke="#1d6340" stroke-width="1.5"/>
  <rect x="467" y="311" width="120" height="16" rx="3" fill="#eaf1ec" stroke="#1d6340" stroke-width="1.5"/>
  <rect x="472" y="300" width="120" height="16" rx="3" fill="#fbf3e0" stroke="#b8870b" stroke-width="1.5"/>
  <rect x="469" y="289" width="120" height="16" rx="3" fill="#eaf1ec" stroke="#1d6340" stroke-width="1.5"/>
  <rect x="473" y="278" width="120" height="16" rx="3" fill="#eaf1ec" stroke="#1d6340" stroke-width="1.5"/>
  <rect x="468" y="267" width="120" height="16" rx="3" fill="#fbf3e0" stroke="#b8870b" stroke-width="1.5"/>
  <rect x="471" y="256" width="120" height="16" rx="3" fill="#eaf1ec" stroke="#1d6340" stroke-width="1.5"/>
  <rect x="470" y="245" width="120" height="16" rx="3" fill="#eaf1ec" stroke="#1d6340" stroke-width="1.5"/>
  <text x="530" y="378" text-anchor="middle" class="lvl">HIGH TRUST</text>
  <text x="530" y="398" text-anchor="middle" class="d">given willingly — mistakes</text>
  <text x="530" y="414" text-anchor="middle" class="d">admitted, traps named</text>
  <text x="530" y="434" text-anchor="middle" class="gold">(gold sheets: the confessions)</text>

  <!-- Trust axis -->
  <line x1="60" y1="350" x2="610" y2="350" stroke="#1d6340" stroke-width="2.5" marker-end="url(#tb-arrow)"/>
  <text x="433" y="341" text-anchor="middle" class="axis">team trust</text>

  <!-- The AI wrinkle -->
  <line x1="666" y1="70" x2="666" y2="430" stroke="#d8d8d2" stroke-width="1.5" stroke-dasharray="6 5"/>
  <rect x="710" y="322" width="120" height="16" rx="3" fill="#ffffff" stroke="#9a9a94" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="707" y="311" width="120" height="16" rx="3" fill="#ffffff" stroke="#9a9a94" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="712" y="300" width="120" height="16" rx="3" fill="#ffffff" stroke="#9a9a94" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="709" y="289" width="120" height="16" rx="3" fill="#ffffff" stroke="#9a9a94" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="713" y="278" width="120" height="16" rx="3" fill="#ffffff" stroke="#9a9a94" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="708" y="267" width="120" height="16" rx="3" fill="#ffffff" stroke="#9a9a94" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="711" y="256" width="120" height="16" rx="3" fill="#ffffff" stroke="#9a9a94" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="710" y="245" width="120" height="16" rx="3" fill="#ffffff" stroke="#9a9a94" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="770" y="378" text-anchor="middle" class="lvl">AI-GENERATED</text>
  <text x="770" y="398" text-anchor="middle" class="d">tall and complete —</text>
  <text x="770" y="414" text-anchor="middle" class="d">no longer a signal</text>
</svg>
