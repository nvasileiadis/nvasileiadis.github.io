# Builds with the repo's own Gemfile (not actions/jekyll-build-pages, which only
# runs GitHub's whitelisted plugins and silently skips jekyll-minifier and
# jekyll-last-modified-at), then deploys to GitHub Pages.
name: "[Master] Build and Deploy Jekyll site to GitHub Pages"

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]

  # Daily rebuild so future-dated posts publish automatically when their date arrives.
  # Posts are dated 10:00 +0000, i.e. a fixed UTC instant, which is what GitHub Actions
  # cron speaks natively — so one run at 10:05 UTC covers every season with no DST hack.
  # (Local clock time therefore drifts: 11:00 BST in summer, 10:00 GMT in winter.)
  schedule:
    - cron: "5 10 * * *"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so jekyll-last-modified-at can read real per-file commit dates
          fetch-depth: 0

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          # Ruby version comes from .ruby-version
          bundler-cache: true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build site
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
