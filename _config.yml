# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you:
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: Nikos Vasileiadis / Software Engineering Leader
email: vasileiadis.nikos@gmail.com
locale: en_GB
description: >- # this means to ignore newlines until "baseurl:"
  Software engineering leader with 20+ years in technology and 9 in leadership. I build the thing that isn't there — teams, platforms, documentation cultures, whole capabilities. Open to Senior Engineering Manager and Head of Engineering roles — UK, and remote with Dutch or Irish organisations.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://nvasileiadis.github.io" # the base hostname & protocol for your site, e.g. http://example.com
linkedin_username: nvasileiadis
github_username: nvasileiadis
author:
  name: Nikos Vasileiadis
  email: vasileiadis.nikos@gmail.com
  linkedin: nvasileiadis
  github: nvasileiadis

# jekyll-seo-tag: emits sameAs links in the JSON-LD, tying the site to these profiles
social:
  name: Nikos Vasileiadis
  links:
    - https://www.linkedin.com/in/nvasileiadis
    - https://github.com/nvasileiadis

# Build settings
theme: minima
timezone: Europe/London
future: false # hold future-dated posts until a scheduled rebuild after their date
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-last-modified-at
  - jekyll-redirect-from
  - jekyll-minifier

# HTML/JS minification (CSS already compressed via Sass)
jekyll-minifier:
  preserve_php: false
  remove_spaces_inside_tags: true
  remove_multi_spaces: true
  remove_comments: true
  remove_intertag_spaces: false
  remove_quotes: false          # keep quotes — safer for structured data / SEO tags
  compress_css: false            # Sass already outputs compressed CSS
  compress_javascript: true
  simple_doctype: false
  remove_script_attributes: false
  remove_style_attributes: false

# SEO / Social Sharing
# 1200x630 card (1.91:1) — square headshots get cropped by LinkedIn/Slack previews
image: /assets/social-card.jpg

defaults:
  - scope:
      path: ""
    values:
      image: /assets/social-card.jpg

# Analytics
# Umami Cloud (cookieless — no consent banner required); script tag lives in _includes/head-custom.html

# Sass configuration
sass:
  sass_dir: _sass
  style: compressed
  quiet_deps: true
  silence_deprecations:
    - import
    - global-builtin
    - color-functions
    - slash-div

# Pages to include in the site header navigation
header_pages:
  - pages/cv.markdown
  - pages/credentials.markdown
  - pages/blog.markdown

# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
#
exclude:
  - _notes/
  - _drafts/
